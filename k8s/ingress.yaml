apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: market-service
  namespace: default
spec:
  ingressClassName: traefik
  rules:
    - host: market.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: market-service
                port:
                  number: 80
