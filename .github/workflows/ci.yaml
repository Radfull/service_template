name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: market}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      MODEL_NAME: ""
      DATABASE_URL: postgresql://postgres:test@localhost:5432/market
      DB_URL: postgresql+asyncpg://postgres:test@localhost:5432/market

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check . --exit-zero
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, kind]
    timeout-minutes: 15
    concurrency:
      group: market-local-deploy
      cancel-in-progress: false

    permissions: {contents: read, packages: read}
    defaults:
      run:
        shell: bash
    env:
      KIND_CLUSTER: market-cluster
      MODEL_NAME: market_model
      MODEL_ALIAS: champion
      INGRESS_HOST: market.localhost

    steps:
      - uses: actions/checkout@v7

      - name: доступ к локальному кластеру
        run: |
          set -euo pipefail
          echo "Runner name: $RUNNER_NAME"
          for tool in docker kind kubectl curl python3 jq; do
            command -v "$tool"
          done
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          export KUBECONFIG="$RUNNER_TEMP/market-kubeconfig"
          kind get kubeconfig --name "$KIND_CLUSTER" --internal > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl config set-context --current --namespace=default
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          echo "INGRESS_URL=http://${KIND_CLUSTER}-control-plane:30080" >> "$GITHUB_ENV"
          kubectl get nodes

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: образ в кластер
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_PASSWORD"
          DB_CONN=$(python3 -c 'import os; from urllib.parse import quote; print("postgresql+asyncpg://postgres:" + quote(os.environ["DB_PASSWORD"], safe="") + "@postgres:5432/market")')
          echo "::add-mask::$DB_CONN"
          kubectl create secret generic market-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="$DB_CONN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: база
        run: |
          set -euo pipefail
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          set -euo pipefail
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          if [ -f k8s/hpa.yaml ]; then
            kubectl apply -f k8s/hpa.yaml
          fi
          kubectl set image --local -f k8s/deployment.yaml api="$IMAGE" -o yaml | kubectl apply -f -
          # Refresh environment from ConfigMap and reload the current champion on reruns.
          kubectl rollout restart deploy/market-service
          kubectl rollout status deploy/market-service --timeout=300s

      - name: smoke через Ingress
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --connect-timeout 5 --max-time 15 \
            -H "Host: $INGRESS_HOST" "$INGRESS_URL/health" -o health.json
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            -H "Host: mlflow.localhost" --get \
            "$INGRESS_URL/api/2.0/mlflow/registered-models/alias" \
            --data-urlencode "name=$MODEL_NAME" --data-urlencode "alias=$MODEL_ALIAS" \
            -o registry.json
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            -X POST -H "Host: $INGRESS_HOST" -H "Content-Type: application/json" \
            --data-binary @tests/good.json "$INGRESS_URL/v1/predict" -o pred.json
          python3 scripts/check_deploy.py
          RID=$(jq -r .request_id pred.json)
          ROWS=$(kubectl exec deploy/postgres -- psql -U postgres -d market \
            -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID'")
          test "$ROWS" = "1"
          echo "Health:"
          cat health.json
          echo
          echo "Prediction:"
          cat pred.json
          echo
          echo "DB rows for request_id=$RID: $ROWS"
          code=$(curl --silent --show-error --connect-timeout 5 --max-time 15 \
            -o /dev/null -w '%{http_code}' -X POST \
            -H "Host: $INGRESS_HOST" -H "Content-Type: application/json" \
            --data-binary '{"age":-1,"work_experience":0,"family_size":1,"gender":0,"ever_married":0,"graduated":0,"spending_score":0}' \
            "$INGRESS_URL/v1/predict")
          [ "$code" = 422 ]

      - name: диагностика
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -30
          kubectl describe deploy/market-service | tail -30
          kubectl describe deploy/postgres | tail -30
          kubectl describe pods -l app=market || true
          kubectl logs -l app=market --all-containers=true --tail=100 --prefix=true || true
          kubectl logs -l app=market --all-containers=true --tail=100 --previous --prefix=true || true
          kubectl logs deploy/postgres --tail=50 || true

      - name: удалить временный kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/market-kubeconfig"
