name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: market}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/market
      DB_URL: postgresql+asyncpg://postgres:test@localhost:5432/market

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - run: uv sync --frozen
      - run: uv run ruff check . --exit-zero
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: read}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: helm/kind-action@v1
        with: {cluster_name: ci}

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name ci

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic market-secrets \
            --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql+asyncpg://postgres:$DB_PASSWORD@postgres:5432/market"

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/market-service api="$IMAGE"
          kubectl rollout status deploy/market-service --timeout=180s

      - name: smoke
        run: |
          kubectl port-forward svc/market-service 8080:80 &
          sleep 5

          curl --fail -s --retry 5 --retry-all-errors localhost:8080/health | tee health.json; echo
          grep -q '"model_path"' health.json

          curl --fail -s -X POST localhost:8080/v1/predict \
            -H "Content-Type: application/json" -d @tests/good.json | tee pred.json; echo

          python3 -c "
          import json
          r = json.load(open('pred.json'))
          probs = r['probs']
          assert set(probs) == {'A','B','C','D'}, probs
          assert all(0 <= v <= 1 for v in probs.values()), probs
          assert abs(sum(probs.values()) - 1) < 1e-6, probs
          assert r['segmentation'] == max(probs, key=probs.get), r
          assert r['response_status'] == 200, r
          "

          sleep 2

          RID=$(jq -r .request_id pred.json)
          kubectl exec deploy/postgres -- psql -U postgres -d market \
            -tAc "SELECT count(*) FROM predictions WHERE request_id = '$RID'" | grep -qx 1

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/v1/predict \
            -H "Content-Type: application/json" \
            -d '{"age":-1,"work_experience":0,"family_size":1,"gender":0,"ever_married":0,"graduated":0,"spending_score":0}')
          [ "$code" = 422 ]

      - name: диагностика
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -30
          kubectl describe deploy/market-service | tail -30
          kubectl describe deploy/postgres | tail -30
          kubectl logs deploy/market-service --tail=100 || true
          kubectl logs deploy/market-service --tail=100 --previous || true
          kubectl logs deploy/postgres --tail=50 || true